<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HSE Performance Monitoring</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f6f9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #appFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* ── Loading overlay -- tampil sampai iframe selesai load ── */
  #loadingOverlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #f4f6f9; transition: opacity .3s ease;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #d8e0ea; border-top-color: #1e3a5f;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: #64748b; }

  /* ── Fallback error state -- tampil kalau iframe gagal dimuat / diblokir ── */
  #errorState {
    position: fixed; inset: 0; z-index: 11; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #f4f6f9; padding: 24px; text-align: center;
  }
  #errorState.show { display: flex; }
  #errorState h2 { font-size: 18px; color: #1e293b; }
  #errorState p { font-size: 13px; color: #64748b; max-width: 420px; line-height: 1.6; }
  #errorState a {
    margin-top: 8px; padding: 10px 20px; background: #1e3a5f; color: #fff; text-decoration: none;
    border-radius: 8px; font-size: 13px; font-weight: 600;
  }
</style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Memuat HSE Performance Monitoring...</div>
  </div>

  <div id="errorState">
    <h2>⚠️ Gagal memuat aplikasi</h2>
    <p>
      Aplikasi tidak bisa dimuat di dalam frame ini. Kemungkinan URL Apps Script belum diisi,
      salah, atau deployment belum di-set ke akses "Anyone". Coba buka langsung lewat tombol di bawah.
    </p>
    <a id="directLink" href="#" target="_blank" rel="noopener">Buka Langsung</a>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyOm92usnaSZvw8BTsrtYCR_LxfWfi9A8MSY162Mb3qUPo5K3cC1Ktq7uhUZCTNcU2nyg/exec"
    title="HSE Performance Monitoring"
    allow="clipboard-write"
  ></iframe>

  <script>
    // ── URL Apps Script Web App (Deploy > Manage deployments) ──────────────
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOm92usnaSZvw8BTsrtYCR_LxfWfi9A8MSY162Mb3qUPo5K3cC1Ktq7uhUZCTNcU2nyg/exec";

    const frame = document.getElementById('appFrame');
    const overlay = document.getElementById('loadingOverlay');
    const errorState = document.getElementById('errorState');
    const directLink = document.getElementById('directLink');

    frame.src = APPS_SCRIPT_URL;
    directLink.href = APPS_SCRIPT_URL;

    let loaded = false;

    frame.addEventListener('load', () => {
      loaded = true;
      overlay.classList.add('hidden');
      errorState.classList.remove('show');
    });

    // Kalau dalam 10 detik iframe belum ter-load sama sekali (mis. URL salah
    // atau diblokir), tampilkan fallback error dengan tombol buka langsung.
    setTimeout(() => {
      if (!loaded) {
        overlay.classList.add('hidden');
        errorState.classList.add('show');
      }
    }, 10000);
  </script>

</body>
</html>
